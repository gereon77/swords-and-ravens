name: CI

on:
  pull_request:

jobs:
  game-server-build:
    name: Game Server Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Build game-server Docker image
      run: docker build . -f ./game_server.Dockerfile
  website-build:
    name: Website Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Build website Docker image
      # Mirrors deploy.yml's build-website-image job: Dockerfile lives inside the project folder,
      # build context is agot-bg-website-dotnet/ (its parent) so it can COPY the sibling
      # agot-bg-website.Data project too.
      run: docker build -f agot-bg-website-dotnet/agot-bg-website/Dockerfile agot-bg-website-dotnet
