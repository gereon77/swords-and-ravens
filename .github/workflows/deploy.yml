name: Deploy

# Manual trigger only for now, while the DigitalOcean droplet + repo secrets are still being
# finished (see agot-bg-website-dotnet/MIGRATION_PLAN.md §16 Phase 2). Once ready to cut over from
# the old Dokku deployment, change this to `push: branches: [master]` (or whatever branch becomes
# the deploy branch after this migration branch is merged).
on:
  workflow_dispatch:

env:
  # GHCR image tags this run builds/deploys — pinned to the commit SHA (mirrors the old Dokku-era
  # deploy.yml's ${{ github.sha }} tags), not `:latest`, so a deploy is always reproducible.
  WEBSITE_IMAGE: ghcr.io/gereon77/swords-and-ravens/website:${{ github.sha }}
  GAME_SERVER_IMAGE: ghcr.io/gereon77/swords-and-ravens/game-server:${{ github.sha }}
  # DigitalOcean Spaces CDN base URL the game client's webpack build embeds into its JS/CSS
  # asset URLs (see webpack.client.js's ASSET_PATH). Must match the actual bucket name
  # (swords-and-ravens-spaces) and region slug (fra1 = Frankfurt) - update if either ever changes.
  # CDN subdomain requires the Spaces CDN to be enabled for this bucket in the DO control panel.
  ASSET_PATH: https://swords-and-ravens-spaces.fra1.cdn.digitaloceanspaces.com/
  # `user@host` for the production droplet. The droplet must already have a one-time
  # `docker login ghcr.io` done (PAT with read:packages) so `docker compose pull` below can
  # authenticate — see MIGRATION_PLAN.md §16 Phase 2.
  DEPLOY_HOST: root@165.245.221.184

jobs:
  build-game-client-assets:
    name: Build game client assets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./agot-bg-game-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Generate JSON schemas
        run: yarn run generate-json-schemas
      - name: Build client
        # Production build only — assets are served from DigitalOcean Spaces (ASSET_PATH above),
        # never baked into the website Docker image itself.
        run: yarn run build-client
      - uses: actions/upload-artifact@v4
        with:
          name: game-client-dist
          path: agot-bg-game-server/dist
          retention-days: 1

  upload-static-assets:
    name: Upload static assets to DigitalOcean Spaces
    runs-on: ubuntu-latest
    needs: [build-game-client-assets]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # DigitalOcean Spaces ignores the actual region value for auth, but botocore/aws-cli crashes
      # with "argument of type 'NoneType' is not a container or iterable" during `s3 sync --acl ...`
      # if no region is configured at all. Use the bucket's real region slug (fra1 = Frankfurt),
      # since it's also part of the SigV4 signing scope DO Spaces validates.
      AWS_DEFAULT_REGION: fra1
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: game-client-dist
          path: dist
      - name: Sync built assets to the Spaces bucket
        # index.html is excluded here — it isn't a static asset, it becomes the website's
        # GameClientTemplates/play.html template instead (see build-website-image below).
        run: |
          aws s3 sync dist/ "s3://${{ secrets.AWS_STORAGE_BUCKET_NAME }}/" \
            --endpoint-url "${{ secrets.AWS_S3_ENDPOINT_URL }}" \
            --exclude "index.html" \
            --acl public-read \
            --delete

  build-website-image:
    name: Build & push website Docker image
    runs-on: ubuntu-latest
    needs: [build-game-client-assets]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: game-client-dist
          path: agot-bg-game-server/dist
      - name: Place generated play.html template
        # PlayApi.cs reads this file at runtime (falls back to play_fake.html if absent) — see
        # MIGRATION_PLAN.md §8.3/§8.4. Its script/link tags already point at the Spaces CDN
        # (ASSET_PATH baked in during the build-game-client-assets job above), so the website
        # image itself never needs the actual JS/CSS bundles.
        run: |
          mkdir -p agot-bg-website-dotnet/agot-bg-website/GameClientTemplates
          cp agot-bg-game-server/dist/index.html agot-bg-website-dotnet/agot-bg-website/GameClientTemplates/play.html
      - name: Login to GitHub Container Registry
        run: docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: docker build -f agot-bg-website-dotnet/agot-bg-website/Dockerfile -t $WEBSITE_IMAGE agot-bg-website-dotnet
      - name: Push image
        run: docker push $WEBSITE_IMAGE

  build-game-server-image:
    name: Build & push game-server Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        run: docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: docker build -f game_server.Dockerfile -t $GAME_SERVER_IMAGE .
      - name: Push image
        run: docker push $GAME_SERVER_IMAGE

  deploy:
    name: Deploy to droplet
    runs-on: ubuntu-latest
    needs: [build-website-image, build-game-server-image, upload-static-assets]
    env:
      SSH_KEY: ${{ secrets.CI_DEPLOY_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
      - name: Sync docker-compose.prod.yml and Caddyfile to the droplet
        # These two files live only on the droplet (see docker-compose.prod.yml's own header
        # comment) and were previously never updated after the one-time manual setup in
        # MIGRATION_PLAN.md - e.g. the Email__Api__*/Email__Ses__* env mappings added to this repo
        # silently never reached the running container, so EMAIL_API_KEY (a Resend key) sat unused
        # in .env.prod and the app kept falling back to SMTP, which DigitalOcean blocks outbound.
        # Copy the current repo versions here on every deploy so that can't happen again.
        run: |
          scp -o StrictHostKeyChecking=no docker-compose.prod.yml Caddyfile $DEPLOY_HOST:/opt/swords-and-ravens/
      - name: Pull new images and restart containers
        # `website`/`game-server` images only — db/redis are untouched by deploys (see
        # docker-compose.prod.yml). WEBSITE_IMAGE/GAME_SERVER_IMAGE passed as shell env vars here
        # override whatever's sitting in .env.prod, without needing to edit that file every run.
        # `caddy` is restarted too (cheap, no image pull) so a changed Caddyfile above always
        # takes effect, even though its image/service definition rarely changes.
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_HOST \
            "cd /opt/swords-and-ravens && \
             WEBSITE_IMAGE=$WEBSITE_IMAGE GAME_SERVER_IMAGE=$GAME_SERVER_IMAGE \
             docker compose -f docker-compose.prod.yml --env-file .env.prod pull website game-server && \
             WEBSITE_IMAGE=$WEBSITE_IMAGE GAME_SERVER_IMAGE=$GAME_SERVER_IMAGE \
             docker compose -f docker-compose.prod.yml --env-file .env.prod up -d website game-server && \
             docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --force-recreate caddy"
      - name: Clean up old images on the droplet
        run: ssh -o StrictHostKeyChecking=no $DEPLOY_HOST "docker image prune -a -f --filter \"until=45m\""
