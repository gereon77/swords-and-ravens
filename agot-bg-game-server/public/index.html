<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/"/>
    <meta charset="UTF-8">
    <title>Play - Swords and Ravens</title>
</head>
<body>
    <div id="root"></div>
    <!--
    In production, the website backend replaces the AUTH_DATA_JSON comment below with a
    <script id="auth-data" type="application/json"> tag containing the auth payload the client
    needs to authenticate its own WebSocket connection to the game server (userId, requestUserId,
    gameId, authToken). "display: none" is there so this placeholder isn't shown during
    development via webpack-dev-server.
    -->
    <div style="display: none">
        <!--AUTH_DATA_JSON-->
    </div>
    <script async defer src="https://sa.swordsandravens.net/latest.js"></script>
    <noscript><img src="https://sa.swordsandravens.net/noscript.gif" alt=""></noscript>
</body>
</html>
